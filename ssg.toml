# Generated site-level configuration for bankingonai.github.io
site_name = "Banking on AI"
site_title = "Banking on AI | Navigating the Future of Financial Intelligence"
site_description = "In-depth insights, regulatory architectures, and technical publications on AI deployment in modern banking."
base_url = "https://bankingonai.co"
language = "en-GB"

content_dir = "_posts"
template_dir = "_layouts"
output_dir = "docs"

[agents]
agents_txt = true
# No OpenAPI or MCP endpoint is served from this static site, so the
# ai-plugin.json and mcp.json manifests would only advertise dead URLs.
ai_plugin = false

[agents.mcp]
enabled = false

[edge_headers]
targets = ["netlify", "cloudflare", "vercel"]
